name: portfolio_flutter
description: A personal portfolio app built with Flutter, Riverpod, and Clean Architecture.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # UI & Navigation
  go_router: ^13.0.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  url_launcher: ^6.2.2
  google_maps_flutter: ^2.5.3
  
  # Form & Validation
  email_validator: ^2.1.17
  
  # HTTP
  http: ^1.1.2
  dio: ^5.4.0
  
  # Firebase
  firebase_core: ^2.24.2
  cloud_firestore: ^4.13.6
  
  # Utils
  flutter_animate: ^4.3.0
  scroll_to_index: ^3.0.0
  
  # Icons
  font_awesome_flutter: ^10.6.0
  
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/fonts/
  
  fonts:
    - family: Recoleta
      fonts:
        - asset: assets/fonts/Recoleta-Regular.woff2
          weight: 400
        - asset: assets/fonts/Recoleta-Medium.woff2
          weight: 500
    # Note: Roboto fonts are not included. The app will use system default font
    # when Roboto is requested. To use Roboto, download fonts from Google Fonts
    # and place them in assets/fonts/ directory, then uncomment below:
    # - family: Roboto
    #   fonts:
    #     - asset: assets/fonts/Roboto-Regular.ttf
    #       weight: 400
    #     - asset: assets/fonts/Roboto-Medium.ttf
    #       weight: 500

